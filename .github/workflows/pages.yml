name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.js

      # Publish only the files the app needs (no tests, workflow or README).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js migration.js vendor _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pull requests only build and test; deploys happen from main or a manual run.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
